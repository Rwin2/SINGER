cohort: "SSV_DAGGER_FULL_CAMPAIGN"
method: "rrt"

review: false

Nep_his: 100
Nep_com: 150

bc_cohort: "ssv_CLIPSEG_NORMAL"
expert_type: "mpc"

# V5 Optimized — BEST configuration found (2026-03-15/16 overnight campaign)
# Results: 2.7% → 12.7% success, 56% → 21.3% collision on multi-branch benchmark
# See: /data/erwinpi/SINGER/DAGGER_CAMPAIGN_SUMMARY.md for full details
n_iterations: 12
Nep_dagger: 20
n_eval_per_iter: 40
n_benchmark: 50
lim_sv: 5
dagger_lr: 0.0001

# Cumulative aggregation: proven essential (V7 without it → only 6%)
aggregate_dagger: true
reset_to_best: true
eval_seed: 42

# Patience=4: noisy eval with 40 runs can cause spurious drops
patience: 4

# Slower beta decay: keep expert guidance >50% for first 5 iterations
# Schedule: 0.80 -> 0.74 -> 0.68 -> 0.62 -> 0.57 -> 0.53 -> 0.49 -> ...
beta_start: 0.80
beta_decay: 0.92

# 8 branches x 3 objects = 24 rollouts per iter
n_rollouts_per_object: 8

# Position perturbation
start_pos_noise: 0.4

# Annotation filtering
deviation_filter_dist: 0.15
close_approach_dist: 5.0
max_annotation_goal_dist: 50.0
max_deviation_dist: 8.0

flights:
  - ["flightroom_ssv_exp", "flightroom_ssv_exp"]

roster:
  - "InstinctJester"
