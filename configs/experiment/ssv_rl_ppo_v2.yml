# PPO Fine-Tuning v2 — UNSEEN eval + branch diversity + tuned hyperparams
# Changes vs v1:
#   - use_unseen_eval: true (33 validation trajectories, never seen in BC/DAgger/PPO)
#   - Branch diversity: seed reset after each benchmark (code fix in train_rl_ppo.py)
#   - Branch ID logging for traceability
#   - ppo_epochs: 3 -> 5 (more gradient steps per batch — v1 had only ~54 updates/iter)
#   - batch_size: 128 -> 64 (2x more updates per epoch)
#   - log_std_init: -2.0 -> -1.5 (more initial exploration, std ≈ 0.22 vs 0.14)
#   - entropy_coef: 0.01 -> 0.02 (stronger exploration incentive)
cohort: "SSV_RL_PPO_V2"
source_cohort: "SSV_DAGGER_CENTROID_V9"
bc_cohort: "ssv_BC_CENTROID_V9"
method: "rrt_6s"

flights:
  - ["flightroom_ssv_exp", "flightroom_ssv_exp"]

roster:
  - "InstinctJester"

# PPO hyperparameters (tuned from v1)
n_iterations: 20
rollouts_per_iter: 8     # 8 branches/object -> 24 rollouts/iter
ppo_epochs: 5            # 5 epochs (was 3) — more gradient steps per batch
batch_size: 64           # smaller batch = more updates per epoch (~180 vs ~54)
actor_lr: 0.000003       # 3e-6
value_lr: 0.0003         # 3e-4 for value network
clip_eps: 0.1            # PPO clipping range
gamma: 0.99
gae_lambda: 0.95
value_coef: 0.5
entropy_coef: 0.02       # 2x entropy bonus (was 0.01) — encourage exploration
kl_coef: 0.1
log_std_init: -1.5       # more initial exploration (std ≈ 0.22, was 0.14 at -2.0)
value_hidden: 256

# Reward weights
goal_progress_weight: 1.0
collision_penalty_weight: 2.0
clearance_threshold: 0.5
fov_bonus: 0.05
success_bonus: 10.0
collision_penalty: 10.0
time_penalty: 0.01

# Stability
max_grad_norm: 0.5
reset_to_best: true

# Evaluation — UNSEEN validation trajectories
use_unseen_eval: true    # uses 33 val trajectories (never seen during training)
n_eval: 20               # ignored when use_unseen_eval=true (uses all val trajs)
eval_seed: 42
patience: 8
