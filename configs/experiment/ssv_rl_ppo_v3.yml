# PPO Fine-Tuning v3 — UNSEEN eval + V1-stable hyperparams + early stopping
# V2 had destructive hyperparams (5 epochs, batch 64 → policy_loss=74.8).
# V3 = V1 hyperparams + V2's unseen eval + early stopping on goal reached.
cohort: "SSV_RL_PPO_V3"
source_cohort: "SSV_DAGGER_CENTROID_V9"
bc_cohort: "ssv_BC_CENTROID_V9"
method: "rrt_6s"

flights:
  - ["flightroom_ssv_exp", "flightroom_ssv_exp"]

roster:
  - "InstinctJester"

# PPO hyperparameters (V1-stable)
n_iterations: 20
rollouts_per_iter: 8     # 8 branches/object -> 24 rollouts/iter
ppo_epochs: 3            # 3 epochs — V1 stable (~57 updates/iter)
batch_size: 128
actor_lr: 0.000003       # 3e-6
value_lr: 0.0003         # 3e-4 for value network
clip_eps: 0.1            # PPO clipping range
gamma: 0.99
gae_lambda: 0.95
value_coef: 0.5
entropy_coef: 0.01       # V1 level — V2's 0.02 was too aggressive
kl_coef: 0.1
log_std_init: -2.0       # V1 level — std ≈ 0.135 (V2's -1.5 caused too much noise)
value_hidden: 256

# Reward weights
goal_progress_weight: 1.0
collision_penalty_weight: 2.0
clearance_threshold: 0.5
fov_bonus: 0.05
success_bonus: 10.0
collision_penalty: 10.0
time_penalty: 0.01

# Stability
max_grad_norm: 0.5
reset_to_best: true

# Evaluation — UNSEEN validation trajectories (full trajectory from t=0)
use_unseen_eval: true    # 33 val trajectories, never seen in BC/DAgger/PPO
n_eval: 20               # ignored when use_unseen_eval=true
eval_seed: 42
patience: 8
