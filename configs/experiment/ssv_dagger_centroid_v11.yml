# DAgger V11 — Fixed centroid + larger Commander + EWC
# Uses BC V11 model (fixed apparent_size, 5 centroid features, Commander [256,128])
# Combines best settings from V9 (centroid) + V10 (EWC/LR schedule)
cohort: "SSV_DAGGER_CENTROID_V11"
method: "rrt_6s"

review: false

Nep_his: 100
Nep_com: 200

bc_cohort: "ssv_BC_CENTROID_V11"
expert_type: "mpc"

dagger_only: false
dagger_oversample: 15

n_iterations: 12
Nep_dagger: 15
n_eval_per_iter: 40
n_benchmark: 50
lim_sv: 10
dagger_lr: 0.00005

aggregate_dagger: true
reset_to_best: true
eval_seed: 42
patience: 5

beta_start: 0.80
beta_decay: 0.92

n_rollouts_per_object: 8

start_pos_noise: 0.4

# Position deviation filter
deviation_filter_dist: 0.3
close_approach_dist: 5.0
max_annotation_goal_dist: 50.0
max_deviation_dist: 8.0

# Orientation filter
orientation_deviation_deg: 15.0
max_orientation_dev_deg: 90.0

# EWC
ewc_lambda: 0.5

# LR schedule
lr_schedule: "cosine"
lr_decay_per_iter: 0.9

# Weight decay
weight_decay: 0.0001

# Collision-weighted loss
collision_weight_alpha: 2.0
collision_weight_threshold: 0.5

flights:
  - ["flightroom_ssv_exp", "flightroom_ssv_exp"]

roster:
  - "InstinctJester"
