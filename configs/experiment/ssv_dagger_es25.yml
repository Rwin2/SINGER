# DAgger on Det BC ES25 — same hyperparams as V9 DAgger (proven best)
# Source: early-stopped deterministic BC at 25 epochs (88% seen benchmark)
cohort: "SSV_DAGGER_ES25"
method: "rrt_6s"

review: false

Nep_his: 100
Nep_com: 150

bc_cohort: "ssv_BC_CENTROID_V9_ES25"
expert_type: "mpc"

# Same anti-overfitting settings as V9
dagger_only: false
dagger_oversample: 20

n_iterations: 12
Nep_dagger: 10
n_eval_per_iter: 40
n_benchmark: 50
lim_sv: 10
dagger_lr: 0.00002

aggregate_dagger: true
reset_to_best: true
eval_seed: 42
patience: 5

beta_start: 0.80
beta_decay: 0.92

n_rollouts_per_object: 8

start_pos_noise: 0.4

# Position deviation filter
deviation_filter_dist: 0.3
close_approach_dist: 5.0
max_annotation_goal_dist: 50.0
max_deviation_dist: 8.0

# Orientation filter
orientation_deviation_deg: 15.0
max_orientation_dev_deg: 90.0

flights:
  - ["flightroom_ssv_exp", "flightroom_ssv_exp"]

roster:
  - "InstinctJester"
