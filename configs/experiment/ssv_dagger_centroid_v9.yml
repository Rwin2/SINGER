# DAgger V9 — CLIPSeg centroid features
# Based on V8 hyperparameters (proven to work) + centroid features in obj_com
# Commander now has explicit bearing/elevation/size from CLIPSeg image
cohort: "SSV_DAGGER_CENTROID_V9"
method: "rrt_6s"

review: false

Nep_his: 100
Nep_com: 150

bc_cohort: "ssv_BC_CENTROID_V9"
expert_type: "mpc"

# Same anti-overfitting settings as V7/V8
dagger_only: false
dagger_oversample: 20

n_iterations: 12
Nep_dagger: 10
n_eval_per_iter: 40
n_benchmark: 50
lim_sv: 10
dagger_lr: 0.00002

aggregate_dagger: true
reset_to_best: true
eval_seed: 42
patience: 5

beta_start: 0.80
beta_decay: 0.92

n_rollouts_per_object: 8

start_pos_noise: 0.4

# Position deviation filter (same as V7/V8)
deviation_filter_dist: 0.3
close_approach_dist: 5.0
max_annotation_goal_dist: 50.0
max_deviation_dist: 8.0

# Orientation filter (from V8)
orientation_deviation_deg: 15.0
max_orientation_dev_deg: 90.0

flights:
  - ["flightroom_ssv_exp", "flightroom_ssv_exp"]

roster:
  - "InstinctJester"
