# DAgger V6 on BC 6s — Corrected evaluation matching Max's code
# V4 INVALIDATED: eval target = trajectory endpoint (should be centroid)
# V5 INVALIDATED: FOV enforced as hard criterion (Max's code doesn't enforce it)
# V6 fix: eval target = centroid, success_radius = r1+2*r2 = 2.3m, FOV informational only
cohort: "SSV_DAGGER_BC6S_V6"
method: "rrt_6s"

review: false

Nep_his: 100
Nep_com: 150

bc_cohort: "ssv_BC_6S"
expert_type: "mpc"

# Mixed training with DAgger oversampling
dagger_only: false
dagger_oversample: 50

n_iterations: 12
Nep_dagger: 20
n_eval_per_iter: 40
n_benchmark: 50
lim_sv: 10
dagger_lr: 0.00005

aggregate_dagger: true
reset_to_best: true
eval_seed: 42
patience: 4

beta_start: 0.80
beta_decay: 0.92

n_rollouts_per_object: 8

start_pos_noise: 0.4

deviation_filter_dist: 0.15
close_approach_dist: 5.0
max_annotation_goal_dist: 50.0
max_deviation_dist: 8.0

flights:
  - ["flightroom_ssv_exp", "flightroom_ssv_exp"]

roster:
  - "InstinctJester"
