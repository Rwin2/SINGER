# BC training with Max's recommended data scale
# duration=6s, rate=20Hz → ~160K samples for 1 scene, 3 objects
cohort: "ssv_BC_6S"
method: "rrt_6s"

review: false

# Training epochs (Max: loss flattens at ~150 epochs)
Nep_his: 100
Nep_com: 150

# DAgger parameters (not used for BC, but required by config)
Nep_dagger: 50
lim_sv: 10

flights:
  - ["flightroom_ssv_exp", "flightroom_ssv_exp"]

roster:
  - "InstinctJester"
