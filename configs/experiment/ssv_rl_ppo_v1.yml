# PPO Fine-Tuning v1 — On-policy with KL constraint to DAgger reference
# Runs on GPU 1 (CUDA_VISIBLE_DEVICES=1) while off-policy smoke6 runs on GPU 0
cohort: "SSV_RL_PPO_V1"
source_cohort: "SSV_DAGGER_CENTROID_V9"
bc_cohort: "ssv_BC_CENTROID_V9"
method: "rrt_6s"

flights:
  - ["flightroom_ssv_exp", "flightroom_ssv_exp"]

roster:
  - "InstinctJester"

# PPO hyperparameters
n_iterations: 20
rollouts_per_iter: 8     # 8 branches/object -> 24 rollouts/iter (on-policy, discarded after update)
ppo_epochs: 3            # gradient passes over each rollout batch
batch_size: 128
actor_lr: 0.000003       # 3e-6 — slightly higher than off-policy since PPO is more stable
value_lr: 0.0003         # 3e-4 for value network
clip_eps: 0.1            # PPO clipping range
gamma: 0.99
gae_lambda: 0.95         # GAE decay — good balance of bias/variance
value_coef: 0.5
entropy_coef: 0.01       # small entropy bonus to encourage exploration
kl_coef: 0.1             # KL penalty to DAgger reference policy
log_std_init: -2.0       # initial std = exp(-2) ≈ 0.135 (small noise around deterministic policy)
value_hidden: 256

# Reward weights (same as off-policy)
goal_progress_weight: 1.0
collision_penalty_weight: 2.0
clearance_threshold: 0.5
fov_bonus: 0.05
success_bonus: 10.0
collision_penalty: 10.0
time_penalty: 0.01

# Stability
max_grad_norm: 0.5
reset_to_best: true

# Evaluation
n_eval: 20
eval_seed: 42
patience: 8
